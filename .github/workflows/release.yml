name: Release

# Publish platform installers to the GitHub Release matching the pushed tag:
#
#   git tag v1.0.1 && git push origin v1.0.1
#
# Each job builds its installer with the tag version in the filename
# (MARKDOWNEDITOR_VERSION), so the asset matches the release even when
# CMakeLists.txt still carries the previous version. Keep the IFW
# config.xml / package.xml versions in sync when bumping a release
# (see Installer/README.md).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup MSVC environment
        # NOTE: ilammy/msvc-dev-cmd targets retired Node 20, so GitHub logs
        # a deprecation warning and force-runs it on Node 24. That is benign;
        # a manual vswhere/vcvars + GITHUB_ENV export was tried and did NOT
        # reliably carry cl.exe into later steps, so the action stays.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6.10 (msvc2022_64)
        # NOTE: Windows stays on 6.10, not 6.11 like the other platforms.
        # Qt 6.11+ ships the Windows repo in a per-arch split layout
        # (qt6_6111/qt6_6111_msvc2022_64, no flat Updates.xml) which
        # aqtinstall <= 3.3.0 cannot read ("Failed to locate XML data",
        # python exit 1). Revisit on uniform 6.11+ once upstream fixes it:
        # https://github.com/miurahr/aqtinstall/issues/1007
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Export Qt prefix and tag version
        shell: pwsh
        run: |
          $qtPrefix = (qmake6 -query QT_INSTALL_PREFIX)
          if (-not $qtPrefix) { throw "qmake6 not found on PATH" }
          "QT_DIR=$qtPrefix" >> $env:GITHUB_ENV
          "MARKDOWNEDITOR_VERSION=$($env:GITHUB_REF_NAME -replace '^v','')" >> $env:GITHUB_ENV

      - name: Install Qt Installer Framework
        shell: pwsh
        run: |
          pip install aqtinstall
          aqt install-tool windows desktop tools_ifw --outputdir "${{ github.workspace }}/Qt-Tools"
          $bc = Get-ChildItem -Path "${{ github.workspace }}/Qt-Tools" -Recurse -Filter binarycreator.exe |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $bc) { throw "binarycreator.exe not found under Qt-Tools" }
          "IFW_BIN=$($bc.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Build Windows offline installer
        # VSCMD_VER is set by msvc-dev-cmd, so windeploy.bat invokes cmake
        # directly instead of re-entering tools\windows\devcmd.bat.
        # `call` is required: without it control transfers to the first
        # script and make-installer.bat would never run.
        shell: cmd
        run: |
          call Installer\Windows\windeploy.bat
          call Installer\Windows\make-installer.bat

      - name: Attach installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: Installer/Windows/MarkdownEditor-*-offline.exe

  release-linux:
    # Oldest supported release: also guards the glibc baseline of the
    # produced binaries.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools and system runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xkb1 \
            libx11-6 libx11-xcb1 libxkbcommon0 libxkbcommon-x11-0 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libegl1 libgl1 libopengl0 libdrm2 \
            libfontconfig1 libfreetype6 libglib2.0-0t libdbus-1-3

      - name: Install Qt 6.11 (gcc_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.1
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Export Qt prefix and tag version
        run: |
          echo "QT_DIR=$(qmake6 -query QT_INSTALL_PREFIX)" >> "$GITHUB_ENV"
          echo "MARKDOWNEDITOR_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install Qt Installer Framework
        run: |
          python3 -m pip install --break-system-packages aqtinstall
          aqt install-tool linux desktop tools_ifw --outputdir "${{ github.workspace }}/Qt-Tools"
          bc="$(find "${{ github.workspace }}/Qt-Tools" -name binarycreator -type f | sort | tail -n 1)"
          test -n "$bc" || { echo "binarycreator not found under Qt-Tools"; exit 1; }
          echo "IFW_BIN=$(dirname "$bc")" >> "$GITHUB_ENV"

      - name: Build Linux offline installer
        run: |
          ./Installer/Linux/linuxdeploy.sh
          ./Installer/Linux/make-installer.sh

      - name: Attach installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: Installer/Linux/MarkdownEditor-*-offline.run

  release-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Check macOS build tools
        run: |
          cmake --version
          ninja --version

      - name: Install Qt 6.11 (macOS universal)
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.1
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Export Qt prefix and tag version
        shell: bash
        run: |
          if command -v qmake6 >/dev/null 2>&1; then
            qt_prefix="$(qmake6 -query QT_INSTALL_PREFIX)"
          else
            qt_prefix="$(qmake -query QT_INSTALL_PREFIX)"
          fi
          echo "QT_DIR=${qt_prefix}" >> "$GITHUB_ENV"
          echo "MARKDOWNEDITOR_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          test -x "${qt_prefix}/bin/macdeployqt6"

      - name: Build universal macOS DMG
        env:
          MARKDOWNEDITOR_PRESET: macos-universal
        run: |
          ./Installer/MacOS/macdeploy.sh
          ./Installer/MacOS/make-installer.sh

      - name: Attach installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: Installer/MacOS/MarkdownEditor-*.dmg
