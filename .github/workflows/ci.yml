name: CI

on:
  push:
  pull_request:

jobs:
  build-test-ubuntu:
    # Oldest supported release: also guards the glibc baseline of the
    # produced binaries.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Qt 6.11 (gcc_64)
        # NOTE: Qt renamed repository arch directories a while ago
        # (gcc_64 -> linux_gcc_64); the old name no longer resolves.
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.1
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Configure debug preset (tests on)
        # No Sonnet on the runner: this exercises the graceful
        # spell-check-disabled path. find_package(Qt6) locates the kit
        # via the Qt6_DIR environment set by install-qt-action.
        run: cmake --preset debug

      - name: Build debug preset
        run: cmake --build --preset debug

      - name: Run tests
        # test_core forces QT_QPA_PLATFORM=offscreen itself.
        run: ctest --preset debug

      - name: Configure release preset
        run: cmake --preset release

  build-test-windows:
    # Native MSVC build + tests, then the offline installer via the
    # Installer/Windows scripts (windeploy.bat + make-installer.bat).
    # The exe attached to a GitHub Release is uploaded from the artifact
    # produced here (see release.yml).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup MSVC environment
        # NOTE: ilammy/msvc-dev-cmd targets retired Node 20, so GitHub logs
        # a deprecation warning and force-runs it on Node 24. That is benign;
        # a manual vswhere/vcvars + GITHUB_ENV export was tried and did NOT
        # reliably carry cl.exe into later steps, so the action stays.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Check Windows build tools
        shell: cmd
        run: |
          cmake --version
          ninja --version
          where cl
          cl

      - name: Install Qt 6.10 (msvc2022_64)
        # NOTE: Windows stays on 6.10, not 6.11 like the other platforms.
        # Qt 6.11+ ships the Windows repo in a per-arch split layout
        # (qt6_6111/qt6_6111_msvc2022_64, no flat Updates.xml) which
        # aqtinstall <= 3.3.0 cannot read ("Failed to locate XML data",
        # python exit 1). Revisit on uniform 6.11+ once upstream fixes it:
        # https://github.com/miurahr/aqtinstall/issues/1007
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Export Qt prefix for CMake and windeployqt
        shell: pwsh
        run: |
          $qtPrefix = (qmake6 -query QT_INSTALL_PREFIX)
          if (-not $qtPrefix) { throw "qmake6 not found on PATH" }
          "QT_DIR=$qtPrefix" >> $env:GITHUB_ENV
          foreach ($tool in "windeployqt6.exe", "windeployqt.exe") {
            if (Test-Path (Join-Path $qtPrefix "bin/$tool")) { break }
          }
          if (-not (Test-Path (Join-Path $qtPrefix "bin/$tool"))) {
            throw "neither windeployqt6.exe nor windeployqt.exe found under $qtPrefix/bin"
          }

      - name: Cache Qt Installer Framework
        id: cache-ifw
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/Qt-Tools
          key: windows-tools-ifw-v1

      - name: Install Qt Installer Framework
        if: steps.cache-ifw.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          pip install aqtinstall
          aqt install-tool windows desktop tools_ifw --outputdir "${{ github.workspace }}/Qt-Tools"

      - name: Export IFW bin dir
        shell: pwsh
        run: |
          $bc = Get-ChildItem -Path "${{ github.workspace }}/Qt-Tools" -Recurse -Filter binarycreator.exe |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $bc) { throw "binarycreator.exe not found under Qt-Tools" }
          "IFW_BIN=$($bc.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Configure Windows debug preset
        shell: cmd
        run: cmake --preset debug

      - name: Build Windows debug preset
        shell: cmd
        run: cmake --build --preset debug

      - name: Run Windows tests
        # test_core forces QT_QPA_PLATFORM=offscreen itself.
        # QT_QPA_FONTDIR: the offscreen platform has no fontconfig; without
        # real fonts, text lays out degenerately and geometry tests
        # (scroll sync, anchors) are meaningless.
        shell: cmd
        env:
          QT_QPA_FONTDIR: 'C:/Windows/Fonts'
        run: ctest --preset debug

      - name: Build Windows offline installer
        # VSCMD_VER is set by msvc-dev-cmd, so windeploy.bat invokes cmake
        # directly instead of re-entering tools\windows\devcmd.bat.
        # `call` is required: without it control transfers to the first
        # script and make-installer.bat would never run.
        shell: cmd
        run: |
          call Installer\Windows\windeploy.bat
          call Installer\Windows\make-installer.bat

      - name: Upload Windows installer artifact
        # v7 runs on Node.js 24 and avoids the deprecated Node.js 20 runtime.
        # CI artifacts are temporary; the permanent copy is the Release asset.
        uses: actions/upload-artifact@v7
        with:
          name: MarkdownEditor-windows
          path: Installer/Windows/MarkdownEditor-*-offline.exe
          if-no-files-found: error
          retention-days: 90

  build-test-macos:
    # Build and test the native app, then publish a universal DMG as an
    # Actions artifact. The downloadable copy attached to a GitHub Release
    # is still managed separately by the release process.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Check macOS build tools
        run: |
          cmake --version
          ninja --version

      - name: Install Qt 6.11 (macOS universal)
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.1
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Export Qt prefix for CMake and macdeployqt
        shell: bash
        run: |
          if command -v qmake6 >/dev/null 2>&1; then
            qt_prefix="$(qmake6 -query QT_INSTALL_PREFIX)"
          else
            qt_prefix="$(qmake -query QT_INSTALL_PREFIX)"
          fi
          echo "QT_DIR=${qt_prefix}" >> "$GITHUB_ENV"
          test -x "${qt_prefix}/bin/macdeployqt6"

      - name: Configure macOS debug preset
        run: cmake --preset debug

      - name: Build macOS debug preset
        run: cmake --build --preset debug

      - name: Run macOS tests
        run: ctest --preset debug

      - name: Build universal macOS DMG
        env:
          MARKDOWNEDITOR_PRESET: macos-universal
        run: |
          ./Installer/MacOS/macdeploy.sh
          ./Installer/MacOS/make-installer.sh

      - name: Upload macOS DMG artifact
        # v7 runs on Node.js 24 and avoids the deprecated Node.js 20 runtime.
        # CI artifacts are temporary; the permanent copy is the Release asset.
        uses: actions/upload-artifact@v7
        with:
          name: MarkdownEditor-macos-universal
          path: Installer/MacOS/MarkdownEditor-*.dmg
          if-no-files-found: error
          retention-days: 90
